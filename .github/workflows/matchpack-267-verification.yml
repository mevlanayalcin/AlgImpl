name: matchpack 267 isolated verification
on:
  push:
    branches: [work/matchpack-267-verification]
    paths:
      - .github/workflows/matchpack-267-verification.yml
      - bounty-work/matchpack-267/**
permissions: {}
concurrency:
  group: matchpack-267-isolated-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      UPSTREAM_SHA: e0864473414ad1b9b0528afff5bda00c7ce67b86
      HARNESS_SHA: ${{ github.sha }}
    steps:
      - name: Install pinned Bun without cache or credentials
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
          no-cache: true
          token: ''
      - name: Read public source at immutable revisions
        shell: bash
        run: |
          set -euo pipefail
          git init harness
          git -C harness fetch --depth=1 https://github.com/mevlanayalcin/AlgImpl.git "$HARNESS_SHA"
          git -C harness checkout --detach FETCH_HEAD
          git init upstream
          git -C upstream fetch --depth=1 https://github.com/tscircuit/matchpack.git "$UPSTREAM_SHA"
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
          bun --version
          bun --revision
      - name: Install dependencies with lifecycle scripts disabled
        working-directory: upstream
        run: bun install --ignore-scripts
      - name: Initialize only sharp native dependency and check it loads
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node -e 'const p = require("./node_modules/sharp/package.json"); console.log(JSON.stringify({name:p.name,version:p.version,scripts:p.scripts},null,2)); if(p.name!=="sharp") process.exit(1)'
          timeout 150s npm rebuild sharp --foreground-scripts --ignore-scripts=false --no-audit --no-fund
          bun -e 'console.log(require("sharp").versions)'
      - name: Baseline full repository tests
        id: baseline_suite
        continue-on-error: true
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          timeout 180s bun test 2>&1 | tee "$RUNNER_TEMP/baseline-suite.log"
      - name: Baseline TypeScript check
        id: baseline_types
        continue-on-error: true
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          timeout 90s bun x --no-install tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/baseline-types.log"
      - name: Verify six regressions fail against original code
        id: red
        working-directory: upstream
        shell: bash
        run: |
          cp ../harness/bounty-work/matchpack-267/solveUntilPhase-terminal.test.ts tests/LayoutPipelineSolver/solveUntilPhase-terminal.test.ts
          set +e
          timeout 90s bun test tests/LayoutPipelineSolver/solveUntilPhase-terminal.test.ts --reporter=junit --reporter-outfile=baseline-regression.xml > "$RUNNER_TEMP/baseline-regression.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/baseline-regression.log"
          test "$code" -eq 1
          grep -q 'terminal-state-no-op' "$RUNNER_TEMP/baseline-regression.log"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('baseline-regression.xml').getroot()
          cases = list(root.iter('testcase'))
          failures = [c for c in cases if c.find('failure') is not None or c.find('error') is not None]
          assert len(cases) == 11, (len(cases), len(failures))
          assert len(failures) == 6, (len(cases), len(failures))
          print('Verified original: 11 tests, 6 failures, 5 passing controls')
          PY
      - name: Apply only terminal-state guard and format new test
        working-directory: upstream
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/solvers/LayoutPipelineSolver/LayoutPipelineSolver.ts')
          old = '    while (this.getCurrentPhase() !== phase) {'
          new = '    while (\n      !this.solved &&\n      !this.failed &&\n      this.getCurrentPhase() !== phase\n    ) {'
          source = path.read_text()
          assert source.count(old) == 1, 'Expected exactly one unchanged loop'
          path.write_text(source.replace(old, new))
          PY
          bun x --no-install biome format --write tests/LayoutPipelineSolver/solveUntilPhase-terminal.test.ts
          git diff --check
          git diff -- lib/solvers/LayoutPipelineSolver/LayoutPipelineSolver.ts
      - name: Patched regression tests
        id: green
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          timeout 90s bun test tests/LayoutPipelineSolver/solveUntilPhase-terminal.test.ts --reporter=junit --reporter-outfile=patched-regression.xml 2>&1 | tee "$RUNNER_TEMP/patched-regression.log"
      - name: Patched full repository tests
        id: patched_suite
        continue-on-error: true
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          timeout 180s bun test 2>&1 | tee "$RUNNER_TEMP/patched-suite.log"
      - name: Patched TypeScript check
        id: patched_types
        continue-on-error: true
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          timeout 90s bun x --no-install tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/patched-types.log"
      - name: Patched package build
        id: build
        continue-on-error: true
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          timeout 120s bun run build 2>&1 | tee "$RUNNER_TEMP/patched-build.log"
      - name: Report real outcomes without hiding failures
        if: always()
        env:
          BASELINE_SUITE: ${{ steps.baseline_suite.outcome }}
          BASELINE_TYPES: ${{ steps.baseline_types.outcome }}
          RED: ${{ steps.red.outcome }}
          GREEN: ${{ steps.green.outcome }}
          PATCHED_SUITE: ${{ steps.patched_suite.outcome }}
          PATCHED_TYPES: ${{ steps.patched_types.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          {
            echo '## matchpack #267 verification'
            echo "Upstream revision: $UPSTREAM_SHA"
            echo "Baseline full suite: $BASELINE_SUITE"
            echo "Baseline TypeScript: $BASELINE_TYPES"
            echo "Expected original six regressions: $RED"
            echo "Patched regression suite: $GREEN"
            echo "Patched full suite: $PATCHED_SUITE"
            echo "Patched TypeScript: $PATCHED_TYPES"
            echo "Patched build: $BUILD"
            echo 'AI-assisted verification. No maintainer acceptance, bounty approval or payment is implied.'
            echo 'No secret, deployment, write-scoped token, cache or uploaded artifact is used.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$RED" = success
          test "$GREEN" = success
          test "$PATCHED_SUITE" = success
          test "$PATCHED_TYPES" = success
          test "$BUILD" = success
