name: ARC verified package - upload separately gated
on:
  push:
    branches: [work/arc-auth-gated-20260921]
    paths:
      - submission-work/arc/**
      - .github/workflows/arc-submission-ready.yml
permissions: {}
concurrency:
  group: arc-auth-gated-20260921
  cancel-in-progress: false
env:
  # The owner confirmed participation, the repository secret, and this upload.
  # Only this exact commit message on its first run attempt may upload.
  ARC_UPLOAD_ENABLED: 'true'
  ARC_UPLOAD_COMMIT_MESSAGE: 'Submit ARC package once after owner confirmed participation and secret on 2026-09-21'
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HARNESS_SHA: ${{ github.sha }}
      STARTER_SHA: 5eb9aa1455fcb3216af55994bdf25dc242b95797
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - name: Read pinned public sources without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          git init harness
          git -C harness fetch --depth=1 https://github.com/mevlanayalcin/AlgImpl.git "$HARNESS_SHA"
          git -C harness checkout --detach FETCH_HEAD
          git init starter
          git -C starter fetch --depth=1 https://github.com/AIcrowd/whest-starterkit.git "$STARTER_SHA"
          git -C starter checkout --detach FETCH_HEAD
      - name: Install exact previously tested API versions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/arc-venv"
          "$RUNNER_TEMP/arc-venv/bin/pip" install --disable-pip-version-check --only-binary=:all: 'flopscope[server]==0.12.1' 'whestbench==0.16.1' 'numpy==2.4.6'
          echo "$RUNNER_TEMP/arc-venv/bin" >> "$GITHUB_PATH"
      - name: Assemble full hybrid and verify exact equivalence
        run: timeout 240s python harness/submission-work/arc/build_and_check.py harness starter dist
      - name: Verify the estimator is unchanged from the earlier tested delivery
        run: echo '2a6745a94ee403b0e49c2372a95dea7c9a7b4684aaafdc7b7953ff57471154a7  dist/estimator.py' | sha256sum --check
      - name: Run official estimator validator
        run: timeout 90s whest validate --estimator dist/estimator.py
      - name: Build official submission tarball without credentials
        shell: bash
        run: |
          set -euo pipefail
          whest package --estimator dist/estimator.py --output dist/submission.tar.gz
          tar -tzf dist/submission.tar.gz
          sha256sum dist/submission.tar.gz > dist/submission.sha256
          printf '%s\n' '{"state":"not_attempted","accepted_submission_id":null}' > dist/submission-attempt.json
      - name: Submit once and verify the actual AIcrowd record
        id: upload
        if: ${{ env.ARC_UPLOAD_ENABLED == 'true' && github.run_attempt == '1' && github.event.head_commit.message == env.ARC_UPLOAD_COMMIT_MESSAGE }}
        env:
          AICROWD_API_KEY: ${{ secrets.AICROWD_API_KEY }}
        run: python harness/submission-tools/arc/submit_once_20260921.py
      - name: Retain only the public package and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arc-auth-gated-package
          path: dist/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
      - name: Report packaging separately from platform acceptance
        if: always()
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo '## ARC delivery state' >> "$GITHUB_STEP_SUMMARY"
          echo "Upload gate: $ARC_UPLOAD_ENABLED; step outcome: $UPLOAD_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo 'Green packaging is not a competition submission. A submission record is not a prize or payment.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f dist/submission-attempt.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat dist/submission-attempt.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
